[workspace]
members = ["crates/gambit-chess", "crates/gambit-cli", "crates/gambit-pgn"]
exclude = ["apps/gambit-desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diegoglozano/gambit"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
