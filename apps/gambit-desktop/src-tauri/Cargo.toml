[package]
name = "gambit-desktop"
version = "0.9.0"
description = "A local-first desktop interface for Gambit chess databases"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diegoglozano/gambit"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gambit = { path = "../../../crates/gambit-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace]
