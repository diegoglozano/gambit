[package]
name = "gambit-desktop"
version = "0.17.0"
description = "A local-first desktop interface for Gambit chess databases"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diegoglozano/gambit"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gambit = { path = "../../../crates/gambit-cli" }
gambit-chess = { path = "../../../crates/gambit-chess" }
gambit-engine = { path = "../../../crates/gambit-engine" }
gambit-coaching = { path = "../../../crates/gambit-coaching" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace]
