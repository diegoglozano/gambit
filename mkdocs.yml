site_name: Gambit documentation
site_description: Inspect and validate PGN corpora from the command line.
site_url: https://diegoglozano.github.io/gambit/docs/
repo_url: https://github.com/diegoglozano/gambit
repo_name: diegoglozano/gambit
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: public/docs
strict: true

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Corpus statistics: statistics.md
  - Query games: query.md
  - CLI reference: cli.md
  - GitHub Actions: github-actions.md
  - Benchmarks:
      - Lichess April 2014: benchmarks/lichess-2014-04.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
