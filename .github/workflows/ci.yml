name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  minimum-rust:
    name: Minimum Rust 1.85
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Check the workspace
        run: cargo check --workspace --all-targets

  cli-platforms:
    name: CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: Run CLI tests
        run: cargo test -p gambit --test cli

  desktop:
    name: Desktop app (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Check frontend JavaScript
        run: node --check apps/gambit-desktop/ui/main.js
      - name: Check desktop formatting
        run: cargo fmt --manifest-path apps/gambit-desktop/src-tauri/Cargo.toml -- --check
      - name: Lint desktop backend
        run: cargo clippy --manifest-path apps/gambit-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test desktop backend
        run: cargo test --manifest-path apps/gambit-desktop/src-tauri/Cargo.toml
      - name: Build preview application
        working-directory: apps/gambit-desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build --debug --bundles app
      - uses: actions/upload-artifact@v7
        with:
          name: gambit-desktop-macos-preview
          path: apps/gambit-desktop/src-tauri/target/debug/bundle/macos/Gambit.app
