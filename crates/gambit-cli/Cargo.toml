[package]
name = "gambit"
version = "0.7.0"
description = "Inspect and validate PGN corpora from the command line"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "gambit"
path = "src/main.rs"

[dependencies]
gambit-chess = { path = "../gambit-chess" }
gambit-pgn = { path = "../gambit-pgn" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
zstd = "0.13.3"

[lints]
workspace = true
