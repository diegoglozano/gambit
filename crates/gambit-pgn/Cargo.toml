[package]
name = "gambit-pgn"
version = "0.6.0"
description = "A zero-copy, streaming PGN parser for chess data pipelines"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
gambit-chess = { path = "../gambit-chess" }

[[example]]
name = "throughput"
path = "examples/throughput.rs"

[[example]]
name = "validate"
path = "examples/validate.rs"

[[example]]
name = "stream-validate"
path = "examples/stream_validate.rs"

[[example]]
name = "incremental-validate"
path = "examples/incremental_validate.rs"

[[example]]
name = "semantic-validate"
path = "examples/semantic_validate.rs"

[[example]]
name = "parallel-semantic-validate"
path = "examples/parallel_semantic_validate.rs"

[[example]]
name = "partitioned-semantic-validate"
path = "examples/partitioned_semantic_validate.rs"
